name = "etth1_patchtst_transferability"
seed = 21
selector = "ten"
output_dir = "results"

[data]
dataset_bundle = "./datasets"
dataset_name = "etth1"
file_name = "ETT-small/ETTh1.csv"
source_pool_datasets = ["etth2", "ettm1", "ettm2"]
episode_mode = "real"
task_name = "long_term_forecast"
features = "M"
freq = "h"
seq_len = 96
label_len = 48
pred_len = 96
train_ratio = 0.7
val_ratio = 0.1
test_ratio = 0.2
window_stride = 8
max_windows_per_split = 256
train_episodes = 100
val_episodes = 30
test_episodes = 30
batch_size = 16
num_sources = 27
target_dim = 10
source_dim = 10
horizon = 4
helpful_delta = 1.5
harmful_delta = -0.5
source_signal_scale = 0.4
target_signal_scale = 0.6
noise_scale = 0.1

[model]
hidden_dim = 24
source_pooling = "average"
energy_temperature = 2.0
energy_top_k = 0
energy_logit_clip = 5.0
energy_center_logits = true
forecast_backbone = "patchtst"
forecast_patch_len = 8
forecast_patch_stride = 4
forecast_n_heads = 2
forecast_n_layers = 2
forecast_d_ff = 64
forecast_dropout = 0.1

[optim]
lr = 0.001
lr_loss = 0.0001
epochs = 20
early_stopping_patience = 5
early_stopping_min_delta = 0.0001
forecast_loss_weight = 1.0
base_forecast_loss_weight = 1.0
forecast_loss_type = "crps"
energy_margin = 0.2
energy_nce_temperature = 1.0
energy_metric_temperature = 0.1
trajectory_energy_weight = 0.001
trajectory_energy_num_samples = 4
